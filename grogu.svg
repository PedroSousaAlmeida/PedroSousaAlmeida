<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <filter id="forceGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="forceAura" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="frogGrad" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#44bb44"/>
      <stop offset="100%" stop-color="#228822"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes blink { 0%,42%,46%,90%,94%,100%{ry:12} 44%{ry:1} 92%{ry:1} }
    @keyframes earWiggleL { 0%,100%{transform:rotate(0deg)} 30%{transform:rotate(-6deg)} 70%{transform:rotate(3deg)} }
    @keyframes earWiggleR { 0%,100%{transform:rotate(0deg)} 30%{transform:rotate(6deg)} 70%{transform:rotate(-3deg)} }
    @keyframes forceOrbit { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes forcePulse { 0%,100%{r:55; opacity:0.08} 50%{r:65; opacity:0.15} }
    @keyframes sparkFloat {
      0% { opacity:0; transform:translateY(0); }
      20% { opacity:1; }
      80% { opacity:1; }
      100% { opacity:0; transform:translateY(-30px); }
    }
    @keyframes frogFloat {
      0%,100% { transform: translate(0,0) rotate(0deg); }
      25% { transform: translate(3px,-5px) rotate(5deg); }
      50% { transform: translate(-2px,-8px) rotate(-3deg); }
      75% { transform: translate(4px,-3px) rotate(2deg); }
    }
    @keyframes handReach { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-15deg)} }
    @keyframes auraBreath { 0%,100%{opacity:0.1} 50%{opacity:0.25} }
    .grogu { animation: float 3.5s ease-in-out infinite; }
    .eye-l { animation: blink 5s ease-in-out infinite; }
    .eye-r { animation: blink 5s ease-in-out infinite; animation-delay: 0.1s; }
    .ear-l { animation: earWiggleL 5s ease-in-out infinite; transform-origin: 105px 95px; }
    .ear-r { animation: earWiggleR 5s ease-in-out infinite; transform-origin: 135px 95px; }
    .force-orbit { animation: forceOrbit 8s linear infinite; transform-origin: 120px 110px; }
    .force-aura { animation: forcePulse 3s ease-in-out infinite; }
    .spark { animation: sparkFloat 3s ease-out infinite; }
    .frog { animation: frogFloat 4s ease-in-out infinite; }
    .hand-l { animation: handReach 4s ease-in-out infinite; transform-origin: 88px 165px; }
    .aura { animation: auraBreath 3s ease-in-out infinite; }
  </style>

  <!-- FORCE AURA -->
  <circle cx="120" cy="130" r="55" fill="url(#forceAura)" class="force-aura"/>
  <circle cx="120" cy="130" r="75" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.08" class="aura"/>
  <circle cx="120" cy="130" r="85" fill="none" stroke="#00d4ff" stroke-width="0.3" opacity="0.05" class="aura" style="animation-delay:1s"/>

  <!-- FORCE ORBITING PARTICLES -->
  <g class="force-orbit">
    <circle cx="120" cy="50" r="2" fill="#00d4ff" opacity="0.6" filter="url(#forceGlow)"/>
    <circle cx="65" cy="140" r="1.5" fill="#00aaff" opacity="0.4" filter="url(#forceGlow)"/>
    <circle cx="175" cy="130" r="1.8" fill="#00d4ff" opacity="0.5" filter="url(#forceGlow)"/>
  </g>
  <g class="force-orbit" style="animation-direction:reverse; animation-duration:12s;">
    <circle cx="120" cy="45" r="1.2" fill="#44ddff" opacity="0.4" filter="url(#forceGlow)"/>
    <circle cx="55" cy="120" r="1" fill="#00d4ff" opacity="0.3" filter="url(#forceGlow)"/>
    <circle cx="185" cy="115" r="1.5" fill="#44ddff" opacity="0.4" filter="url(#forceGlow)"/>
  </g>

  <g class="grogu">
    <!-- ROBE / BODY -->
    <ellipse cx="120" cy="175" rx="38" ry="38" fill="#7a6840"/>
    <ellipse cx="120" cy="170" rx="35" ry="32" fill="#8f7d52"/>
    <!-- Robe folds -->
    <path d="M 95 170 Q 100 185 105 175" stroke="#6b5c38" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M 130 168 Q 135 182 140 172" stroke="#6b5c38" stroke-width="0.8" fill="none" opacity="0.5"/>
    <!-- Robe collar -->
    <ellipse cx="120" cy="148" rx="24" ry="9" fill="#7a6840"/>
    <ellipse cx="120" cy="147" rx="22" ry="7" fill="#8f7d52"/>

    <!-- HEAD -->
    <ellipse cx="120" cy="105" rx="33" ry="32" fill="#4a8240"/>
    <ellipse cx="120" cy="108" rx="31" ry="28" fill="#5a9a4e"/>
    <!-- Forehead wrinkles -->
    <path d="M 106 85 Q 120 80 134 85" stroke="#4a8240" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M 108 89 Q 120 85 132 89" stroke="#4a8240" stroke-width="0.8" fill="none" opacity="0.35"/>
    <path d="M 110 93 Q 120 90 130 93" stroke="#4a8240" stroke-width="0.8" fill="none" opacity="0.3"/>

    <!-- EARS -->
    <g class="ear-l">
      <ellipse cx="72" cy="98" rx="30" ry="10" fill="#4a8240" transform="rotate(-12 72 98)"/>
      <ellipse cx="72" cy="98" rx="26" ry="6" fill="#6aaa58" transform="rotate(-12 72 98)"/>
      <!-- Ear inner detail -->
      <ellipse cx="65" cy="97" rx="15" ry="4" fill="#78b866" transform="rotate(-12 65 97)" opacity="0.4"/>
    </g>
    <g class="ear-r">
      <ellipse cx="168" cy="98" rx="30" ry="10" fill="#4a8240" transform="rotate(12 168 98)"/>
      <ellipse cx="168" cy="98" rx="26" ry="6" fill="#6aaa58" transform="rotate(12 168 98)"/>
      <ellipse cx="175" cy="97" rx="15" ry="4" fill="#78b866" transform="rotate(12 175 97)" opacity="0.4"/>
    </g>

    <!-- EYES -->
    <ellipse class="eye-l" cx="108" cy="104" rx="9" ry="12" fill="#1a1a1a"/>
    <ellipse class="eye-r" cx="132" cy="104" rx="9" ry="12" fill="#1a1a1a"/>
    <!-- Iris -->
    <ellipse cx="108" cy="104" rx="6" ry="8" fill="#2D2D2D"/>
    <ellipse cx="132" cy="104" rx="6" ry="8" fill="#2D2D2D"/>
    <!-- Eye shine -->
    <circle cx="112" cy="100" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="136" cy="100" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="105" cy="108" r="1.5" fill="#ffffff" opacity="0.4"/>
    <circle cx="129" cy="108" r="1.5" fill="#ffffff" opacity="0.4"/>

    <!-- NOSE -->
    <ellipse cx="120" cy="114" rx="2" ry="1.5" fill="#4a8240" opacity="0.5"/>

    <!-- MOUTH (cute smile) -->
    <path d="M 112 120 Q 120 127 128 120" stroke="#3a6e32" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- HANDS -->
    <g class="hand-l">
      <circle cx="85" cy="165" r="7" fill="#5a9a4e"/>
      <!-- Fingers -->
      <circle cx="79" cy="160" r="2.5" fill="#5a9a4e"/>
      <circle cx="78" cy="165" r="2.5" fill="#5a9a4e"/>
      <circle cx="80" cy="170" r="2.5" fill="#5a9a4e"/>
    </g>
    <!-- Right hand reaching for frog -->
    <circle cx="155" cy="165" r="7" fill="#5a9a4e"/>
    <circle cx="161" cy="160" r="2.5" fill="#5a9a4e"/>
    <circle cx="162" cy="165" r="2.5" fill="#5a9a4e"/>
    <circle cx="160" cy="170" r="2.5" fill="#5a9a4e"/>
  </g>

  <!-- FLOATING FROG (being Force-lifted!) -->
  <g class="frog">
    <ellipse cx="175" cy="128" rx="8" ry="6" fill="url(#frogGrad)"/>
    <circle cx="172" cy="124" r="2" fill="#55cc55"/>
    <circle cx="178" cy="124" r="2" fill="#55cc55"/>
    <circle cx="172" cy="123.5" r="1" fill="#111"/>
    <circle cx="178" cy="123.5" r="1" fill="#111"/>
    <!-- Frog legs -->
    <ellipse cx="170" cy="133" rx="3" ry="2" fill="#339933" transform="rotate(-20 170 133)"/>
    <ellipse cx="180" cy="133" rx="3" ry="2" fill="#339933" transform="rotate(20 180 133)"/>
    <!-- Force glow on frog -->
    <circle cx="175" cy="128" r="12" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="11;14;11" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- FLOATING SPARKLES -->
  <circle cx="70" cy="80" r="1.5" fill="#00d4ff" class="spark" style="animation-delay:0s"/>
  <circle cx="170" cy="70" r="1.2" fill="#44ddff" class="spark" style="animation-delay:0.8s"/>
  <circle cx="55" cy="140" r="1" fill="#00d4ff" class="spark" style="animation-delay:1.5s"/>
  <circle cx="185" cy="150" r="1.3" fill="#44ddff" class="spark" style="animation-delay:2.2s"/>
  <circle cx="90" cy="60" r="0.8" fill="#00d4ff" class="spark" style="animation-delay:0.5s"/>
  <circle cx="150" cy="55" r="1" fill="#44ddff" class="spark" style="animation-delay:1.8s"/>
  <circle cx="60" cy="170" r="1.2" fill="#00d4ff" class="spark" style="animation-delay:1s"/>
  <circle cx="180" cy="85" r="0.9" fill="#44ddff" class="spark" style="animation-delay:2.5s"/>

  <!-- TEXT -->
  <text x="120" y="240" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00d4ff" opacity="0.7">
    This is the way.
  </text>
  <text x="120" y="255" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#4a7a9c" opacity="0.5">
    🐸 Companheiro de Jornada
  </text>
</svg>
