<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    @keyframes twinkle1 { 0%,100%{opacity:0.2} 50%{opacity:1} }
    @keyframes twinkle2 { 0%,100%{opacity:0.8} 50%{opacity:0.1} }
    @keyframes twinkle3 { 0%,100%{opacity:0.5} 50%{opacity:0.9} }
    @keyframes saberGlow { 0%,100%{opacity:0.6} 50%{opacity:1} }
    @keyframes floatText { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    .star1 { animation: twinkle1 3s ease-in-out infinite; }
    .star2 { animation: twinkle2 4s ease-in-out infinite; }
    .star3 { animation: twinkle3 2.5s ease-in-out infinite; }
    .title-group { animation: floatText 4s ease-in-out infinite; }
  </style>
  
  <!-- Background -->
  <rect width="900" height="300" fill="url(#bgGrad)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="#fff" class="star1"/>
  <circle cx="150" cy="60" r="1" fill="#fff" class="star2"/>
  <circle cx="250" cy="20" r="1.2" fill="#fff" class="star3"/>
  <circle cx="350" cy="50" r="0.8" fill="#fff" class="star1"/>
  <circle cx="450" cy="15" r="1.5" fill="#fff" class="star2"/>
  <circle cx="550" cy="45" r="1" fill="#fff" class="star3"/>
  <circle cx="650" cy="25" r="1.3" fill="#fff" class="star1"/>
  <circle cx="750" cy="55" r="0.9" fill="#fff" class="star2"/>
  <circle cx="850" cy="35" r="1.1" fill="#fff" class="star3"/>
  <circle cx="100" cy="80" r="0.7" fill="#fff" class="star2"/>
  <circle cx="300" cy="75" r="1.2" fill="#fff" class="star1"/>
  <circle cx="500" cy="70" r="0.8" fill="#fff" class="star3"/>
  <circle cx="700" cy="85" r="1" fill="#fff" class="star2"/>
  <circle cx="800" cy="65" r="0.6" fill="#fff" class="star1"/>
  <circle cx="80" cy="250" r="1" fill="#fff" class="star3"/>
  <circle cx="200" cy="270" r="0.8" fill="#fff" class="star1"/>
  <circle cx="400" cy="260" r="1.2" fill="#fff" class="star2"/>
  <circle cx="600" cy="280" r="0.7" fill="#fff" class="star3"/>
  <circle cx="820" cy="255" r="1.1" fill="#fff" class="star1"/>
  
  <!-- Left lightsaber -->
  <!-- Hilt -->
  <rect x="130" y="143" width="35" height="14" rx="2" fill="#999"/>
  <rect x="135" y="141" width="25" height="18" rx="2" fill="#bbb"/>
  <circle cx="150" cy="150" r="2.5" fill="#ff4444" opacity="0.9"/>
  <!-- Blade -->
  <rect x="20" y="145" width="110" height="10" rx="5" fill="#00d4ff" opacity="0.3" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="147" width="110" height="6" rx="3" fill="#00d4ff"/>
  <rect x="20" y="148" width="110" height="4" rx="2" fill="#fff" opacity="0.5"/>
  
  <!-- Right lightsaber -->
  <!-- Hilt -->
  <rect x="735" y="143" width="35" height="14" rx="2" fill="#999"/>
  <rect x="740" y="141" width="25" height="18" rx="2" fill="#bbb"/>
  <circle cx="750" cy="150" r="2.5" fill="#ff4444" opacity="0.9"/>
  <!-- Blade -->
  <rect x="770" y="145" width="110" height="10" rx="5" fill="#00d4ff" opacity="0.3" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <rect x="770" y="147" width="110" height="6" rx="3" fill="#00d4ff"/>
  <rect x="770" y="148" width="110" height="4" rx="2" fill="#fff" opacity="0.5"/>
  
  <!-- Title -->
  <g class="title-group">
    <text x="450" y="125" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold" fill="#00d4ff" filter="url(#glow)">
      ⚔️ Pedro Sousa Almeida ⚔️
    </text>
    <text x="450" y="165" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#7eb8da">
      Jedi Developer | May the Code be with you
    </text>
  </g>
  
  <!-- Bottom decorative line -->
  <line x1="200" y1="200" x2="700" y2="200" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="210" x2="650" y2="210" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Bottom subtitle -->
  <text x="450" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#00d4ff" opacity="0.7">
    "Do. Or do not. There is no try." — Mestre Yoda
  </text>
  <text x="450" y="270" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#7eb8da" opacity="0.5">
    Python • JavaScript/TypeScript • Go
  </text>
</svg>
