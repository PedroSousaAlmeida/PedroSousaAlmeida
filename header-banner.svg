<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020810"/>
      <stop offset="30%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#071020"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <radialGradient id="planetGrad2" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#2e7d5b"/>
      <stop offset="60%" stop-color="#1a4a35"/>
      <stop offset="100%" stop-color="#0d2b1f"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="shootingStar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes twinkle1 { 0%,100%{opacity:0.15} 50%{opacity:0.9} }
    @keyframes twinkle2 { 0%,100%{opacity:0.7} 50%{opacity:0.1} }
    @keyframes twinkle3 { 0%,100%{opacity:0.4} 50%{opacity:1} }
    @keyframes xwingFly { 
      0% { transform: translate(920px, 140px); }
      35% { transform: translate(400px, 100px); }
      50% { transform: translate(300px, 110px); }
      65% { transform: translate(200px, 90px); }
      100% { transform: translate(-120px, 70px); }
    }
    @keyframes tieFly {
      0% { transform: translate(-100px, 60px); }
      100% { transform: translate(950px, 180px); }
    }
    @keyframes floatTitle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes shootingStarAnim {
      0% { transform: translate(700px, 20px) rotate(-30deg); opacity: 0; }
      5% { opacity: 1; }
      30% { transform: translate(400px, 80px) rotate(-30deg); opacity: 1; }
      35% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes shootingStarAnim2 {
      0%,50% { opacity: 0; }
      55% { transform: translate(200px, 10px) rotate(-25deg); opacity: 1; }
      80% { transform: translate(-50px, 60px) rotate(-25deg); opacity: 1; }
      85% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes laserShoot {
      0%,85%,100% { opacity: 0; }
      40% { opacity: 1; }
      55% { opacity: 1; }
      56% { opacity: 0; }
    }
    @keyframes nebulaPulse { 0%,100%{opacity:0.03} 50%{opacity:0.08} }
    .s1 { animation: twinkle1 3s ease-in-out infinite; }
    .s2 { animation: twinkle2 4s ease-in-out infinite; }
    .s3 { animation: twinkle3 2.5s ease-in-out infinite; }
    .xwing { animation: xwingFly 12s linear infinite; }
    .tie { animation: tieFly 15s linear infinite; animation-delay: 3s; }
    .title-float { animation: floatTitle 4s ease-in-out infinite; }
    .shooting1 { animation: shootingStarAnim 8s ease-out infinite; }
    .shooting2 { animation: shootingStarAnim2 10s ease-out infinite; }
    .laser { animation: laserShoot 12s linear infinite; }
    .nebula { animation: nebulaPulse 6s ease-in-out infinite; }
  </style>

  <!-- BACKGROUND -->
  <rect width="900" height="320" fill="url(#bgGrad)"/>

  <!-- NEBULAS -->
  <ellipse cx="200" cy="160" rx="200" ry="120" fill="#1a3a6c" class="nebula" opacity="0.05"/>
  <ellipse cx="700" cy="100" rx="180" ry="100" fill="#4a1a6c" class="nebula" opacity="0.04" style="animation-delay:2s"/>
  <ellipse cx="450" cy="250" rx="250" ry="80" fill="#006a6c" class="nebula" opacity="0.03" style="animation-delay:4s"/>

  <!-- STARS — tiny -->
  <circle cx="23" cy="15" r="0.5" fill="#fff" class="s1"/>
  <circle cx="67" cy="42" r="0.6" fill="#fff" class="s2"/>
  <circle cx="112" cy="8" r="0.4" fill="#fff" class="s3"/>
  <circle cx="156" cy="67" r="0.5" fill="#fff" class="s1" style="animation-delay:0.5s"/>
  <circle cx="198" cy="23" r="0.7" fill="#fff" class="s2" style="animation-delay:1s"/>
  <circle cx="245" cy="56" r="0.4" fill="#fff" class="s3" style="animation-delay:0.3s"/>
  <circle cx="289" cy="12" r="0.6" fill="#fff" class="s1" style="animation-delay:1.5s"/>
  <circle cx="334" cy="78" r="0.5" fill="#fff" class="s2" style="animation-delay:0.8s"/>
  <circle cx="378" cy="34" r="0.4" fill="#fff" class="s3" style="animation-delay:2s"/>
  <circle cx="423" cy="5" r="0.7" fill="#fff" class="s1" style="animation-delay:0.2s"/>
  <circle cx="467" cy="62" r="0.5" fill="#fff" class="s2" style="animation-delay:1.2s"/>
  <circle cx="512" cy="18" r="0.6" fill="#fff" class="s3" style="animation-delay:0.7s"/>
  <circle cx="556" cy="45" r="0.4" fill="#fff" class="s1" style="animation-delay:1.8s"/>
  <circle cx="601" cy="72" r="0.5" fill="#fff" class="s2" style="animation-delay:0.4s"/>
  <circle cx="645" cy="28" r="0.7" fill="#fff" class="s3" style="animation-delay:1.1s"/>
  <circle cx="689" cy="55" r="0.4" fill="#fff" class="s1" style="animation-delay:2.2s"/>
  <circle cx="734" cy="10" r="0.6" fill="#fff" class="s2" style="animation-delay:0.6s"/>
  <circle cx="778" cy="40" r="0.5" fill="#fff" class="s3" style="animation-delay:1.4s"/>
  <circle cx="823" cy="68" r="0.4" fill="#fff" class="s1" style="animation-delay:0.9s"/>
  <circle cx="867" cy="22" r="0.7" fill="#fff" class="s2" style="animation-delay:1.7s"/>
  <!-- STARS — medium -->
  <circle cx="45" cy="95" r="0.8" fill="#fff" class="s3" style="animation-delay:0.3s"/>
  <circle cx="130" cy="120" r="1" fill="#cce8ff" class="s1" style="animation-delay:1.2s"/>
  <circle cx="210" cy="88" r="0.9" fill="#fff" class="s2" style="animation-delay:0.7s"/>
  <circle cx="340" cy="105" r="0.8" fill="#fff" class="s3" style="animation-delay:2.1s"/>
  <circle cx="480" cy="92" r="1.1" fill="#cce8ff" class="s1" style="animation-delay:0.5s"/>
  <circle cx="570" cy="115" r="0.9" fill="#fff" class="s2" style="animation-delay:1.6s"/>
  <circle cx="660" cy="98" r="0.8" fill="#fff" class="s3" style="animation-delay:0.2s"/>
  <circle cx="790" cy="108" r="1" fill="#cce8ff" class="s1" style="animation-delay:1.9s"/>
  <!-- STARS — bottom -->
  <circle cx="35" cy="250" r="0.6" fill="#fff" class="s1" style="animation-delay:1s"/>
  <circle cx="120" cy="270" r="0.8" fill="#fff" class="s3" style="animation-delay:0.4s"/>
  <circle cx="250" cy="285" r="0.5" fill="#fff" class="s2" style="animation-delay:1.5s"/>
  <circle cx="380" cy="260" r="0.7" fill="#fff" class="s1" style="animation-delay:0.6s"/>
  <circle cx="520" cy="278" r="0.6" fill="#fff" class="s3" style="animation-delay:2s"/>
  <circle cx="650" cy="255" r="0.8" fill="#fff" class="s2" style="animation-delay:0.3s"/>
  <circle cx="760" cy="290" r="0.5" fill="#fff" class="s1" style="animation-delay:1.3s"/>
  <!-- STARS — bright -->
  <circle cx="85" cy="180" r="1.3" fill="#fff" class="s1" style="animation-delay:0.5s"/>
  <circle cx="300" cy="200" r="1.5" fill="#e0f0ff" class="s3" style="animation-delay:1.8s"/>
  <circle cx="720" cy="190" r="1.4" fill="#fff" class="s2" style="animation-delay:0.2s"/>
  <circle cx="500" cy="230" r="1.2" fill="#e0f0ff" class="s1" style="animation-delay:1s"/>

  <!-- PLANET bottom-left -->
  <circle cx="80" cy="310" r="55" fill="url(#planetGrad2)" opacity="0.6"/>
  <ellipse cx="80" cy="300" rx="55" ry="8" fill="none" stroke="#2e7d5b" stroke-width="0.5" opacity="0.3"/>
  <circle cx="80" cy="310" r="58" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>

  <!-- PLANET top-right with ring -->
  <circle cx="830" cy="40" r="20" fill="#1a3a5c" opacity="0.5"/>
  <circle cx="830" cy="40" r="22" fill="none" stroke="#00d4ff" stroke-width="0.3" opacity="0.2"/>
  <ellipse cx="830" cy="40" rx="35" ry="6" fill="none" stroke="#4a7a9c" stroke-width="1.2" opacity="0.35" transform="rotate(-15 830 40)"/>

  <!-- SHOOTING STARS -->
  <g class="shooting1">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#shootingStar)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="60" cy="0" r="1.5" fill="#fff"/>
  </g>
  <g class="shooting2">
    <line x1="0" y1="0" x2="45" y2="0" stroke="url(#shootingStar)" stroke-width="1" stroke-linecap="round"/>
    <circle cx="45" cy="0" r="1" fill="#fff"/>
  </g>

  <!-- X-WING -->
  <g class="xwing">
    <polygon points="-35,0 -10,-3 10,-2 15,0 10,2 -10,3" fill="#c8c8c8" stroke="#888" stroke-width="0.5"/>
    <ellipse cx="-5" cy="0" rx="8" ry="3" fill="#aabbc8"/>
    <ellipse cx="-3" cy="0" rx="5" ry="2" fill="#ddeeff" opacity="0.6"/>
    <polygon points="10,-1.5 22,0 10,1.5" fill="#999"/>
    <polygon points="-25,-3 -15,-3 -5,-18 -20,-18" fill="#aaa" stroke="#777" stroke-width="0.3"/>
    <polygon points="-25,-3 -15,-3 -5,-16 -20,-16" fill="#bbb" stroke="#777" stroke-width="0.3"/>
    <polygon points="-25,3 -15,3 -5,18 -20,18" fill="#aaa" stroke="#777" stroke-width="0.3"/>
    <polygon points="-25,3 -15,3 -5,16 -20,16" fill="#bbb" stroke="#777" stroke-width="0.3"/>
    <rect x="-8" y="-19.5" width="12" height="1.5" rx="0.5" fill="#888"/>
    <rect x="-8" y="-15" width="12" height="1.5" rx="0.5" fill="#888"/>
    <rect x="-8" y="18" width="12" height="1.5" rx="0.5" fill="#888"/>
    <rect x="-8" y="13.5" width="12" height="1.5" rx="0.5" fill="#888"/>
    <ellipse cx="-36" cy="0" rx="4" ry="2" fill="#ff6622" opacity="0.8"/>
    <ellipse cx="-37" cy="0" rx="3" ry="1.5" fill="#ffaa44" opacity="0.6"/>
    <ellipse cx="-38" cy="0" rx="2" ry="1" fill="#ffddaa" opacity="0.4"/>
    <g class="laser">
      <rect x="4" y="-19" width="30" height="1" rx="0.5" fill="#00ff44" opacity="0.9" filter="url(#glow)"/>
      <rect x="4" y="18.5" width="30" height="1" rx="0.5" fill="#00ff44" opacity="0.9" filter="url(#glow)"/>
      <rect x="15" y="-15.5" width="25" height="1" rx="0.5" fill="#00ff44" opacity="0.7" filter="url(#glow)"/>
      <rect x="15" y="14.5" width="25" height="1" rx="0.5" fill="#00ff44" opacity="0.7" filter="url(#glow)"/>
    </g>
    <circle cx="-15" cy="0" r="2.5" fill="#2266cc"/>
    <circle cx="-15" cy="-0.5" r="1" fill="#fff" opacity="0.5"/>
  </g>

  <!-- TIE FIGHTER -->
  <g class="tie">
    <circle cx="0" cy="0" r="6" fill="#555" stroke="#333" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#444"/>
    <polygon points="-2,-2 2,-2 3,0 2,2 -2,2 -3,0" fill="#1a3a5c" opacity="0.8"/>
    <polygon points="-7,-2 -7,2 -22,15 -25,15 -25,-15 -22,-15" fill="#666" stroke="#444" stroke-width="0.5"/>
    <line x1="-22" y1="-15" x2="-22" y2="15" stroke="#555" stroke-width="0.5"/>
    <polygon points="7,-2 7,2 22,15 25,15 25,-15 22,-15" fill="#666" stroke="#444" stroke-width="0.5"/>
    <line x1="22" y1="-15" x2="22" y2="15" stroke="#555" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="2" fill="#ff4444" opacity="0.3"/>
  </g>

  <!-- TITLE -->
  <g class="title-float">
    <text x="450" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="bold" fill="#00d4ff" filter="url(#softGlow)" opacity="0.3">Pedro Sousa Almeida</text>
    <text x="450" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="bold" fill="#00d4ff" filter="url(#glow)">Pedro Sousa Almeida</text>
    <text x="450" y="172" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#7eb8da" letter-spacing="3">⚔️  JEDI DEVELOPER  ⚔️</text>
    <text x="450" y="210" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#00d4ff" opacity="0.5">"Do. Or do not. There is no try." — Mestre Yoda</text>
    <text x="450" y="235" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#4a7a9c" opacity="0.6">Python  •  JavaScript/TypeScript  •  Go</text>
  </g>

  <line x1="180" y1="250" x2="720" y2="250" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
</svg>
