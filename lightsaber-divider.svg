<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80">
  <defs>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="clashGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#aaddff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes igniteBlue {
      0% { width: 0; }
      60% { width: 310; }
      100% { width: 310; }
    }
    @keyframes igniteRed {
      0% { width: 0; x: 460; }
      60% { width: 310; x: 460; }
      100% { width: 310; }
    }
    @keyframes clashFlash {
      0%,50% { opacity: 0; r: 0; }
      60% { opacity: 1; r: 20; }
      65% { opacity: 0.8; r: 15; }
      70% { opacity: 0.5; r: 25; }
      75% { opacity: 0.3; r: 10; }
      80%,100% { opacity: 0; r: 5; }
    }
    @keyframes sparkFly1 {
      0%,55% { opacity: 0; cx: 400; cy: 40; }
      60% { opacity: 1; }
      80% { opacity: 0; cx: 370; cy: 15; }
      100% { opacity: 0; }
    }
    @keyframes sparkFly2 {
      0%,55% { opacity: 0; cx: 400; cy: 40; }
      60% { opacity: 1; }
      80% { opacity: 0; cx: 430; cy: 65; }
      100% { opacity: 0; }
    }
    @keyframes sparkFly3 {
      0%,55% { opacity: 0; cx: 400; cy: 40; }
      60% { opacity: 1; }
      80% { opacity: 0; cx: 385; cy: 68; }
      100% { opacity: 0; }
    }
    @keyframes sparkFly4 {
      0%,55% { opacity: 0; cx: 400; cy: 40; }
      60% { opacity: 1; }
      80% { opacity: 0; cx: 418; cy: 12; }
      100% { opacity: 0; }
    }
    @keyframes sparkFly5 {
      0%,55% { opacity: 0; cx: 400; cy: 40; }
      60% { opacity: 1; }
      80% { opacity: 0; cx: 360; cy: 55; }
      100% { opacity: 0; }
    }
    @keyframes sparkFly6 {
      0%,55% { opacity: 0; cx: 400; cy: 40; }
      60% { opacity: 1; }
      80% { opacity: 0; cx: 440; cy: 20; }
      100% { opacity: 0; }
    }
    @keyframes bladeHum1 { 0%,100%{opacity:0.25} 50%{opacity:0.5} }
    @keyframes bladeHum2 { 0%,100%{opacity:0.5} 50%{opacity:0.25} }
    .blue-glow { animation: bladeHum1 1.5s ease-in-out infinite; }
    .red-glow { animation: bladeHum2 1.8s ease-in-out infinite; }
    .clash { animation: clashFlash 5s ease-out infinite; }
    .sp1 { animation: sparkFly1 5s ease-out infinite; }
    .sp2 { animation: sparkFly2 5s ease-out infinite; }
    .sp3 { animation: sparkFly3 5s ease-out infinite; }
    .sp4 { animation: sparkFly4 5s ease-out infinite; }
    .sp5 { animation: sparkFly5 5s ease-out infinite; }
    .sp6 { animation: sparkFly6 5s ease-out infinite; }
  </style>

  <!-- LEFT HILT (Jedi) -->
  <rect x="350" y="33" width="12" height="14" rx="2" fill="#aaa"/>
  <rect x="340" y="35" width="15" height="10" rx="1" fill="#ccc"/>
  <rect x="343" y="37" width="2" height="6" fill="#888"/>
  <rect x="348" y="37" width="2" height="6" fill="#888"/>
  <circle cx="357" cy="40" r="2" fill="#00aaff" opacity="0.8"/>

  <!-- RIGHT HILT (Sith — enemy) -->
  <rect x="438" y="33" width="12" height="14" rx="2" fill="#aaa"/>
  <rect x="445" y="35" width="15" height="10" rx="1" fill="#ccc"/>
  <rect x="450" y="37" width="2" height="6" fill="#888"/>
  <rect x="455" y="37" width="2" height="6" fill="#888"/>
  <circle cx="443" cy="40" r="2" fill="#ff4444" opacity="0.8"/>

  <!-- BLUE BLADE (left → center) -->
  <rect x="80" y="35" width="260" height="10" rx="5" fill="#00d4ff" opacity="0.2" class="blue-glow" filter="url(#glowBlue)">
    <animate attributeName="width" from="0" to="260" dur="1.5s" fill="freeze"/>
  </rect>
  <rect x="80" y="37" width="260" height="6" rx="3" fill="#00d4ff">
    <animate attributeName="width" from="0" to="260" dur="1.5s" fill="freeze"/>
  </rect>
  <rect x="80" y="38" width="260" height="4" rx="2" fill="#ffffff" opacity="0.5">
    <animate attributeName="width" from="0" to="260" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- RED BLADE (right → center) -->
  <rect x="460" y="35" width="260" height="10" rx="5" fill="#ff2222" opacity="0.2" class="red-glow" filter="url(#glowRed)">
    <animate attributeName="width" from="0" to="260" dur="1.5s" fill="freeze" begin="0.3s"/>
  </rect>
  <rect x="460" y="37" width="260" height="6" rx="3" fill="#ff3333">
    <animate attributeName="width" from="0" to="260" dur="1.5s" fill="freeze" begin="0.3s"/>
  </rect>
  <rect x="460" y="38" width="260" height="4" rx="2" fill="#ffaaaa" opacity="0.5">
    <animate attributeName="width" from="0" to="260" dur="1.5s" fill="freeze" begin="0.3s"/>
  </rect>

  <!-- CLASH POINT (center) -->
  <circle cx="400" cy="40" r="0" fill="url(#clashGlow)" class="clash"/>

  <!-- SPARKS -->
  <circle cx="400" cy="40" r="1.5" fill="#fff" class="sp1"/>
  <circle cx="400" cy="40" r="1.2" fill="#ffdd44" class="sp2"/>
  <circle cx="400" cy="40" r="1" fill="#fff" class="sp3"/>
  <circle cx="400" cy="40" r="1.3" fill="#ffdd44" class="sp4"/>
  <circle cx="400" cy="40" r="0.8" fill="#fff" class="sp5"/>
  <circle cx="400" cy="40" r="1.1" fill="#ffdd44" class="sp6"/>
</svg>
