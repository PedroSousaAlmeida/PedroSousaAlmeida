<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60">
  <style>
    @keyframes igniteLeft {
      0% { width: 0; opacity: 0; }
      20% { opacity: 1; }
      100% { width: 320; opacity: 1; }
    }
    @keyframes igniteRight {
      0% { width: 0; opacity: 0; x: 460; }
      20% { opacity: 1; }
      100% { width: 320; opacity: 1; x: 460; }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; r: 1; }
      50% { opacity: 1; r: 2.5; }
    }
  </style>
  
  <!-- Left hilt -->
  <rect x="330" y="22" width="40" height="16" rx="3" fill="#888"/>
  <rect x="335" y="20" width="30" height="20" rx="2" fill="#aaa"/>
  <rect x="340" y="24" width="3" height="12" rx="1" fill="#666"/>
  <rect x="346" y="24" width="3" height="12" rx="1" fill="#666"/>
  <circle cx="355" cy="30" r="3" fill="#ff3333" opacity="0.8"/>
  
  <!-- Right hilt -->
  <rect x="430" y="22" width="40" height="16" rx="3" fill="#888"/>
  <rect x="435" y="20" width="30" height="20" rx="2" fill="#aaa"/>
  <rect x="451" y="24" width="3" height="12" rx="1" fill="#666"/>
  <rect x="457" y="24" width="3" height="12" rx="1" fill="#666"/>
  <circle cx="445" cy="30" r="3" fill="#ff3333" opacity="0.8"/>
  
  <!-- Left blade glow -->
  <rect x="10" y="25" width="320" height="10" rx="5" fill="#00d4ff" opacity="0.3" filter="url(#blurLeft)">
    <animate attributeName="width" from="0" to="320" dur="1.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </rect>
  <!-- Left blade -->
  <rect x="10" y="27" width="320" height="6" rx="3" fill="#00d4ff">
    <animate attributeName="width" from="0" to="320" dur="1.5s" fill="freeze"/>
  </rect>
  <rect x="10" y="28" width="320" height="4" rx="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="width" from="0" to="320" dur="1.5s" fill="freeze"/>
  </rect>
  
  <!-- Right blade glow -->
  <rect x="470" y="25" width="320" height="10" rx="5" fill="#00d4ff" opacity="0.3">
    <animate attributeName="width" from="0" to="320" dur="1.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </rect>
  <!-- Right blade -->
  <rect x="470" y="27" width="320" height="6" rx="3" fill="#00d4ff">
    <animate attributeName="width" from="0" to="320" dur="1.5s" fill="freeze"/>
  </rect>
  <rect x="470" y="28" width="320" height="4" rx="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="width" from="0" to="320" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- Sparkles along blades -->
  <circle cx="100" cy="30" r="1" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="200" cy="30" r="1.5" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="2.3s"/>
  </circle>
  <circle cx="550" cy="30" r="1" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="2.1s"/>
  </circle>
  <circle cx="680" cy="30" r="1.5" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
</svg>
